<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoTuLabs - Coming Soon</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'shimmer': 'shimmer 10s ease-in-out infinite',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { 'background-position': '-200% 0' },
                            '15%': { 'background-position': '200% 0' },
                            '100%': { 'background-position': '200% 0' },
                        }
                    }
                }
            }
        }
    </script>
</head>

<body
    class="bg-slate-950 text-slate-100 flex flex-col items-center justify-center min-h-screen p-6 overflow-hidden relative">

    <div
        class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-cyan-500/10 blur-[120px] rounded-full pointer-events-none">
    </div>
    <div
        class="absolute bottom-1/4 left-1/2 -translate-x-1/2 translate-y-1/2 w-[400px] h-[400px] bg-blue-500/10 blur-[100px] rounded-full pointer-events-none">
    </div>

    <div class="relative z-10 max-w-2xl text-center px-4">

        <div class="relative inline-block mb-8 group">
            <div
                class="absolute -inset-1 bg-gradient-to-r block from-cyan-500 to-blue-500 rounded-full blur opacity-40 group-hover:opacity-75 transition duration-1000 group-hover:duration-200 animate-pulse-slow">
            </div>
            <img src="logo.png" alt="CoTuLabs Logo"
                class="relative h-40 w-40 mx-auto rounded-full object-cover border-2 border-slate-800 bg-slate-900 shadow-2xl">
        </div>

        <h1 class="text-6xl font-black tracking-tight mb-4 select-none
                   bg-gradient-to-r from-slate-300 via-white via-cyan-200 via-white to-slate-300 
                   bg-[length:200%_auto] bg-clip-text text-transparent animate-shimmer">
            CoTuLabs
        </h1>

        <p class="text-lg md:text-xl text-slate-400 max-w-xl mx-auto font-medium leading-relaxed mb-4">
            Advancing AI Research through <span class="text-cyan-400 font-semibold">Natural Language Processing</span> &
            <span class="text-blue-400 font-semibold">Computer Vision</span>.
        </p>

        <div class="inline-flex flex-wrap items-center justify-center gap-3 mb-12">
            <!-- Location Pill -->
            <div
                class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-slate-900/60 border border-slate-800/80 text-sm text-slate-300 backdrop-blur-sm hover:border-slate-700/80 transition-all duration-300">
                <span class="relative flex h-2 w-2">
                    <span
                        class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span class="font-medium">Can Tho, Vietnam</span>
                <span class="text-xs">🇻🇳</span>
            </div>

            <!-- Time Pill -->
            <div
                class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-slate-900/60 border border-slate-800/80 text-sm text-slate-300 backdrop-blur-sm hover:border-slate-700/80 transition-all duration-300">
                <svg class="w-4 h-4 text-cyan-400/80 animate-pulse" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span id="vn-time" class="font-mono text-cyan-400 font-semibold tracking-wide"></span>
                <span
                    class="text-[10px] font-bold text-slate-500 tracking-wider uppercase bg-slate-800 px-1.5 py-0.5 rounded">ICT</span>
            </div>
        </div>

        <div class="border-t border-slate-900 pt-8">
            <p class="text-xs uppercase tracking-[0.2em] text-slate-500 font-bold mb-3">Project Status</p>
            <span
                class="text-sm font-mono text-cyan-500/90 bg-cyan-950/30 border border-cyan-900/50 px-4 py-1.5 rounded-md">
                system.init // Coming Soon
            </span>
        </div>
    </div>

    <footer class="absolute bottom-6 text-xs text-slate-600 font-mono">
        &copy; 2026 CoTuLabs. All rights reserved.
    </footer>

    <script>
        function updateVNTime() {
            const options = {
                timeZone: 'Asia/Ho_Chi_Minh',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };
            const formatter = new Intl.DateTimeFormat('en-US', options);
            document.getElementById('vn-time').textContent = formatter.format(new Date());
        }
        updateVNTime();
        setInterval(updateVNTime, 1000);
    </script>
</body>

</html>
