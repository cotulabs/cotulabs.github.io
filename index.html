<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoTuLabs - Coming Soon</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'shimmer': 'shimmer 10s ease-in-out infinite',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { 'background-position': '-200% 0' },
                            '15%': { 'background-position': '200% 0' },
                            '100%': { 'background-position': '200% 0' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --transition-duration: 2s;
            --sky-start: #020617;
            --sky-end: #0f172a;
            --water-start: #020617;
            --water-end: #0c1524;
            --glow-color-1: rgba(6, 182, 212, 0.08);
            --glow-color-2: rgba(59, 130, 246, 0.08);
            --celestial-color: #f8fafc;
            --celestial-shadow: rgba(248, 250, 252, 0.25);
            --sun-cx: 700px;
            --sun-cy: 130px;
            --sun-r: 45px;
            --sun-opacity: 0;
            --moon-opacity: 1;
            --moon-cx: 250px;
            --moon-cy: 100px;
            --star-opacity: 1;
            --bridge-color: #070b13;
            --bridge-light-opacity: 1;
            --bridge-light-color: #d8b4fe;
            --palm-color: #030508;
            --boat-color: #010204;
            --boat-light-opacity: 1;
            --water-ripple-opacity: 0.15;
            --cai-rang-opacity: 0;

            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #94a3b8;
            --heading-color: #ffffff;
            --heading-shadow: rgba(6, 182, 212, 0.3);
            --accent-cyan: #22d3ee;
            --accent-blue: #60a5fa;
            --logo-border: #1e293b;
            --logo-bg: #0f172a;
            --pill-bg: rgba(15, 23, 42, 0.6);
            --pill-border: rgba(30, 41, 59, 0.8);
            --pill-text: #cbd5e1;
            --ict-bg: #1e293b;
            --ict-text: #94a3b8;
            --divider-color: rgba(15, 23, 42, 0.8);
            --status-bg: rgba(34, 211, 238, 0.1);
            --status-border: rgba(34, 211, 238, 0.3);
            --status-text: #22d3ee;
        }

        body {
            background: linear-gradient(to bottom, var(--sky-start) 0%, var(--sky-end) 100%);
            color: var(--text-primary);
            transition: background var(--transition-duration) ease-in-out, color var(--transition-duration) ease-in-out;
        }

        .heading {
            color: var(--heading-color);
            text-shadow: 0 2px 12px var(--heading-shadow);
            transition: color var(--transition-duration) ease-in-out, text-shadow var(--transition-duration) ease-in-out;
        }

        .subtitle {
            color: var(--text-secondary);
            transition: color var(--transition-duration) ease-in-out;
        }

        .accent-cyan {
            color: var(--accent-cyan);
            transition: color var(--transition-duration) ease-in-out;
        }

        .accent-blue {
            color: var(--accent-blue);
            transition: color var(--transition-duration) ease-in-out;
        }

        .logo-img {
            border-color: var(--logo-border);
            background-color: var(--logo-bg);
            transition: border-color var(--transition-duration) ease-in-out, background-color var(--transition-duration) ease-in-out;
        }

        .pill {
            background-color: var(--pill-bg);
            border: 1px solid var(--pill-border);
            color: var(--pill-text);
            backdrop-filter: blur(8px);
            transition: all var(--transition-duration) ease-in-out;
        }

        .pill-icon {
            color: var(--accent-cyan);
            transition: color var(--transition-duration) ease-in-out;
        }

        .ict-tag {
            background-color: var(--ict-bg);
            color: var(--ict-text);
            transition: background-color var(--transition-duration) ease-in-out, color var(--transition-duration) ease-in-out;
        }

        .divider {
            border-color: var(--divider-color);
            transition: border-color var(--transition-duration) ease-in-out;
        }

        .status-title {
            color: var(--text-muted);
            transition: color var(--transition-duration) ease-in-out;
        }

        .status-pill {
            background-color: var(--status-bg);
            border: 1px solid var(--status-border);
            color: var(--status-text);
            transition: all var(--transition-duration) ease-in-out;
        }

        .glow-1 {
            background-color: var(--glow-color-1);
            transition: background-color var(--transition-duration) ease-in-out;
        }

        .glow-2 {
            background-color: var(--glow-color-2);
            transition: background-color var(--transition-duration) ease-in-out;
        }

        .star {
            animation: twinkle 4s ease-in-out infinite;
        }
        .star-fast { animation-duration: 2s; }
        .star-medium { animation-duration: 4s; }
        .star-slow { animation-duration: 6s; }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        .wave-1 {
            animation: float-wave-1 16s ease-in-out infinite;
        }
        .wave-2 {
            animation: float-wave-2 20s ease-in-out infinite;
        }

        @keyframes float-wave-1 {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-30px); }
        }
        @keyframes float-wave-2 {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(30px); }
        }

        #cai-rang-market {
            opacity: var(--cai-rang-opacity);
            pointer-events: none;
            transition: opacity var(--transition-duration) ease-in-out;
        }

        .cai-rang-boat-1 { animation: drift-cai-rang-1 14s ease-in-out infinite; }
        .cai-rang-boat-2 { animation: drift-cai-rang-2 18s ease-in-out infinite; }
        .cai-rang-boat-3 { animation: drift-cai-rang-3 12s ease-in-out infinite; }
        .cai-rang-boat-4 { animation: drift-cai-rang-4 16s ease-in-out infinite; }

        @keyframes drift-cai-rang-1 {
            0%, 100% { transform: translate(220px, 475px) rotate(0deg); }
            50% { transform: translate(260px, 477px) rotate(1deg); }
        }
        @keyframes drift-cai-rang-2 {
            0%, 100% { transform: translate(420px, 510px) rotate(0.5deg); }
            50% { transform: translate(380px, 508px) rotate(-0.5deg); }
        }
        @keyframes drift-cai-rang-3 {
            0%, 100% { transform: translate(680px, 465px) rotate(0deg); }
            50% { transform: translate(710px, 466px) rotate(0.8deg); }
        }
        @keyframes drift-cai-rang-4 {
            0%, 100% { transform: translate(880px, 490px) rotate(-0.5deg); }
            50% { transform: translate(840px, 492px) rotate(0.5deg); }
        }
    </style>
</head>

                '--pill-text': '#cbd5e1',
                '--ict-bg': '#1e293b',
                '--ict-text': '#94a3b8',
                '--divider-color': 'rgba(15, 23, 42, 0.8)',
                '--status-bg': 'rgba(34, 211, 238, 0.1)',
                '--status-border': 'rgba(34, 211, 238, 0.3)',
                '--status-text': '#22d3ee',
                '--cai-rang-opacity': 0
            }
        };

        let currentMode = 'auto';

        function applyTheme(themeName) {
            const root = document.documentElement;
            const theme = themes[themeName];
            for (const [key, val] of Object.entries(theme)) {
                root.style.setProperty(key, val);
            }
            
            const sun = document.getElementById('sun');
            const moon = document.getElementById('moon');
            if (sun) {
                sun.setAttribute('cx', theme['--sun-cx']);
                sun.setAttribute('cy', theme['--sun-cy']);
                sun.setAttribute('r', theme['--sun-r']);
                sun.style.opacity = theme['--sun-opacity'];
            }
            if (moon) {
                moon.setAttribute('transform', `translate(${theme['--moon-cx']}, ${theme['--moon-cy']})`);
                moon.style.opacity = theme['--moon-opacity'];
            }
        }

        function getAutoTheme(hour) {
            if (hour >= 5 && hour < 8) return 'morning';
            if (hour >= 8 && hour < 17) return 'day';
            if (hour >= 17 && hour < 19) return 'sunset';
            return 'night';
        }

        function updateVNTime() {
            const date = new Date();
            const options = {
                timeZone: 'Asia/Ho_Chi_Minh',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            const formatter = new Intl.DateTimeFormat('en-US', options);
            const timeStr = formatter.format(date);
            document.getElementById('vn-time').textContent = timeStr;

            const [hStr, mStr, sStr] = timeStr.split(':');
            const hour = parseInt(hStr, 10);
            const minute = parseInt(mStr, 10);
            const second = parseInt(sStr, 10);

            if (currentMode === 'auto') {
                const autoTheme = getAutoTheme(hour);
                applyTheme(autoTheme);

                const t = hour + minute / 60 + second / 3600;
                const sun = document.getElementById('sun');
                const moon = document.getElementById('moon');

                if (t >= 5 && t <= 19) {
                    const f = (t - 5) / 14;
                    const sunCx = 150 + f * 900;
                    const sunCy = 80 + 250 * Math.pow(2 * f - 1, 2);
                    
                    let sunOpacity = 1;
                    if (f < 0.05) sunOpacity = f / 0.05;
                    else if (f > 0.95) sunOpacity = (1 - f) / 0.05;

                    if (sun) {
                        sun.setAttribute('cx', sunCx);
                        sun.setAttribute('cy', sunCy);
                        sun.style.opacity = sunOpacity;
                    }
                    if (moon) {
                        moon.style.opacity = 0;
                    }
                    document.documentElement.style.setProperty('--star-opacity', 0);
                } else {
                    let tOffset = t - 19;
                    if (tOffset < 0) tOffset += 24;
                    const f_moon = tOffset / 10;
                    const moonCx = 150 + f_moon * 900;
                    const moonCy = 80 + 250 * Math.pow(2 * f_moon - 1, 2);

                    let moonOpacity = 1;
                    if (f_moon < 0.05) moonOpacity = f_moon / 0.05;
                    else if (f_moon > 0.95) moonOpacity = (1 - f_moon) / 0.05;

                    if (moon) {
                        moon.setAttribute('transform', `translate(${moonCx}, ${moonCy})`);
                        moon.style.opacity = moonOpacity;
                    }
                    if (sun) {
                        sun.style.opacity = 0;
                    }
                    
                    let starOpacity = 1;
                    if (f_moon < 0.1) starOpacity = f_moon / 0.1;
                    else if (f_moon > 0.9) starOpacity = (1 - f_moon) / 0.1;
                    document.documentElement.style.setProperty('--star-opacity', starOpacity);
                }
            }
        }

        function setTimeMode(mode) {
            currentMode = mode;
            const modes = ['auto', 'morning', 'day', 'sunset', 'night'];
            modes.forEach(m => {
                const btn = document.getElementById(`btn-${m}`);
                if (btn) {
                    if (m === mode) {
                        btn.className = 'px-2.5 py-1.5 rounded-full transition-all duration-200 font-medium text-cyan-400 bg-slate-800 flex items-center gap-1';
                    } else {
                        btn.className = 'px-2.5 py-1.5 rounded-full transition-all duration-200 font-medium text-slate-400 hover:text-slate-200 flex items-center gap-1';
                    }
                }
            });

            if (mode === 'auto') {
                updateVNTime();
            } else {
                applyTheme(mode);
            }
        }

        updateVNTime();
        setInterval(updateVNTime, 1000);
    </script>
